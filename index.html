<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Center Image with Flexbox</title>
    <style>
        .container {
            display: flex;
            justify-content: center; /* Centers the image horizontally */
            align-items: center;     /* Optional: Centers vertically if container has a height */
            height: 100vh;           /* Optional: Makes the container fill the full screen height */
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="your-image.jpg" alt="Flexbox Centered Image">
    </div>

</body>
